<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Inscripción - Parte 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <script>
        // Variables desde el backend
        const id_pais_estudio = {{ id_pais_estudio }};
        const anio_actual = {{ anio_actual }};

        function toggleLaborFields() {
            const trabajaSi = document.getElementById('trabaja_si');
            const trabajaNo = document.getElementById('trabaja_no');
            const laborFields = document.querySelectorAll('.labor-field');

            if (trabajaSi.checked) {
                laborFields.forEach(field => field.disabled = false);
            } else {
                laborFields.forEach(field => field.disabled = true);
                laborFields.forEach(field => field.value = '');
            }
        }

        // Ejecutar funciones en la carga de la página
        window.onload = function() {
            toggleLaborFields();
        };

        function validar_numeros(input) {
            // Solo permite números, elimina cualquier otro caracter
            input.value = input.value.replace(/[^0-9]/g, '');
        }

        function validarAnioEgreso(input) {
            const valor = parseInt(input.value);
            const errorElement = document.getElementById('error-anio-egreso');
            
            if (valor < 1900 || valor > anio_actual) {
                errorElement.style.display = 'block';
                input.setCustomValidity('Año inválido');
            } else {
                errorElement.style.display = 'none';
                input.setCustomValidity('');
            }
        }

        function validarAnioEgresoOtros(input) {
            const valor = parseInt(input.value);
            const errorElement = document.getElementById('error-anio-egreso-otros');
            
            if (input.value && (valor < 1900 || valor > anio_actual)) {
                errorElement.style.display = 'block';
                input.setCustomValidity('Año inválido');
            } else {
                errorElement.style.display = 'none';
                input.setCustomValidity('');
            }
        }
    </script>
    <style>
            html{
                margin-left: 15%;
            }
            html, body{
                height: 100%;
                display: flex;
                justify-content: center; /* Centra horizontalmente */
                align-content: center; /* Centra verticalmente */
            }
                        
    </style>
</head>
<body>
    <div class="container">
        <div class="container rounded-sm" id="cont-insc">
        {% include 'navbar.html' %}


            <div class="form-container">
                <!-- Sección de Estudios Cursados -->
                    <h4 class="text-primary text-center mt-3">Estudios Cursados</h4>
                    <form method="POST" action="/pre_inscripcion_3">
                    <div class="form-row">
                        <div class="col col-md-4 form-group">
                            <label for="titulo_base">Título Secundario:</label>
                            <input class="form-control form-control-sm" type="text" id="titulo_base" name="titulo_base" required>
                        </div>
                        <div class="col col-md-3 form-group">
                            <label for="anio_egreso">Año de Egreso:</label>
                            <input class="form-control form-control-sm" type="number" id="anio_egreso" name="anio_egreso" 
                                   min="1900" max="{{ anio_actual }}" 
                                   oninput="validarAnioEgreso(this)" required>
                            <small class="form-text text-danger" id="error-anio-egreso" style="display:none;">
                                Ingrese un número correcto
                            </small>
                        </div>
                        <!-- Selección de provincia -->
                        <div class="col col-md-4 form-group">
                            <label for="provincia_estudio_otros">Provincia:</label>
                            <select class="form-control form-control-sm" id="provincia_estudio_otros" name="provincia_estudio_otros">
                                <option value="">Seleccione una provincia</option>
                                {% for provincia in provincias %}
                                    <option value="{{ provincia[0] }}">{{ provincia[2] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="otros_estudios">Otros Estudios:</label>
                            <input class="form-control form-control-sm" type="text" id="otros_estudios" name="otros_estudios">
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="anio_egreso_otros">Año de Egreso (Otros Estudios):</label>
                            <input class="form-control form-control-sm" type="number" id="anio_egreso_otros" name="anio_egreso_otros" 
                                   min="1900" max="{{ anio_actual }}" 
                                   oninput="validarAnioEgresoOtros(this)">
                            <small class="form-text text-danger" id="error-anio-egreso-otros" style="display:none;">
                                Ingrese un número correcto
                            </small>
                        </div>
                    </div>
                <!-- Sección de Datos Laborales -->
            <div class="form-container">
                    <h4 class="text-primary text-center mt-3">Datos Laborales</h4>
                    <div class="form-row">
                        <div class="col col-md-4 mt-3">
                            <label style="font-size: 12px;">¿Trabaja?</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input ml-2" type="radio" id="trabaja_si" name="trabaja" value="si" onclick="toggleLaborFields()">
                                <label class="form-check-label" for="trabaja_si">Sí</label>
                                <input class="form-check-input ml-2" type="radio" id="trabaja_no" name="trabaja" value="no" onclick="toggleLaborFields()" checked>
                                <label class="form-check-label" for="trabaja_no">No</label>
                            </div>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="actividad">Actividad:</label>
                            <input class="labor-field form-control form-control-sm" type="text" id="actividad" name="actividad" disabled>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="horario_habitual">Horario Habitual:</label>
                            <input class="labor-field form-control form-control-sm" type="text" id="horario_habitual" name="horario_habitual" disabled>
                        </div>
                        <div class="col col-md-4 form-group">
                            <label for="obra_social">Obra Social:</label>
                            <input class="labor-field form-control form-control-sm" type="text" id="obra_social" name="obra_social" disabled>
                        </div>
                    </div>
            </div>
                

            <div class="actions" id="boton-siguiente">
                <button type="submit" class="float-right mb-3">Siguiente</button>
            </div>
        </form>
        <div class="action" id="boton-atras">
            <form method="GET" action="{{ url_for('pre_inscripcion') }}">
                <button type="submit" class="float-left mb-3">Atrás</button>
            </form>
        </div>
        </div>
    </div>
    <!-- Scripts cargados en el head -->
</body>
</html>
